<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a12"/>
      <stop offset="50%" stop-color="#09060a"/>
      <stop offset="100%" stop-color="#1f0914"/>
    </linearGradient>
    <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#be123c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heart-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="40%" stop-color="#f43f5e"/>
      <stop offset="80%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#e11d48" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  
  <!-- Outer Subtle Glass Border -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#e11d48" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Radial Glow Behind Heart -->
  <circle cx="256" cy="256" r="210" fill="url(#glow-grad)"/>

  <!-- Romantic Heart Shape -->
  <path d="M256,432 C246,422 72,284 72,176 C72,112 122,64 186,64 C222,64 246,84 256,100 C266,84 290,64 326,64 C390,64 440,112 440,176 C440,284 266,422 256,432 Z"
        fill="url(#heart-grad)"
        filter="url(#soft-shadow)"/>

  <!-- Camera Aperture / Memory Ring in Center -->
  <circle cx="256" cy="220" r="48" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.9"/>
  <circle cx="256" cy="220" r="22" fill="#ffffff" opacity="0.95"/>
  
  <!-- Sparkle Star -->
  <g transform="translate(360, 110) scale(1.1)">
    <path d="M0,-24 Q0,0 24,0 Q0,0 0,24 Q0,0 -24,0 Q0,0 0,-24 Z" fill="#fff1f2" opacity="0.9"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>
</svg>
